<!DOCTYPE html>
<html>
<head>
    <title>Sand Plant Log</title>
</head>
<body>

<h1>Sand Plant Shift Log</h1>

<p>
Buckets: <input type="number" id="b" value="60">
</p>

<p>
Gravel (TN): <input type="number" id="g" value="180">
</p>

<p>
Sand (TN): <input type="number" id="s" value="0">
</p>

<button onclick="calc()">CALCULATE</button>

<p>
<strong>Input TN:</strong> <span id="inp">256.8</span>
</p>

<p>
<strong>Output TN:</strong> <span id="out">180</span>
</p>

<p>
<strong>Yield %:</strong> <span id="yield">70.1</span>
</p>

<script>
function calc() {
    var buckets = document.getElementById('b').value;
    var gravel = document.getElementById('g').value;
    var sand = document.getElementById('s').value;
    
    var input = buckets * 4.28;
    var output = parseInt(gravel) + parseInt(sand);
    var yield_pct = (output / input * 100).toFixed(1);
    
    document.getElementById('inp').innerHTML = input.toFixed(2);
    document.getElementById('out').innerHTML = output;
    document.getElementById('yield').innerHTML = yield_pct;
}
</script>

</body>
</html>
